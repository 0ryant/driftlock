name: conformance-taudit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taudit-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Install taudit CLI
        run: cargo install taudit --locked
      - name: taudit workflow scan
        run: bash scripts/ci/conformance_taudit.sh
